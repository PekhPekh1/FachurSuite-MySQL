<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>خطا در اتصال</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b1020; color: #e2e8f0; display: grid; place-items: center; min-height: 90vh; margin: 0; }
      .card { max-width: 420px; padding: 32px; border-radius: 16px; background: #111a30; text-align: center; }
      h1 { font-size: 1.2rem; }
      p { color: #94a1b8; line-height: 1.8; }
    </style>

  <body>
    <div class="card">
      <h1>اتصال به سرور برقرار نشد</h1>
      <p>لطفاً اتصال اینترنت را بررسی کرده و مجدداً تلاش کنید. این اپلیکیشن دسکتاپ برای کار کردن نیاز به سرور دارد.</p>
    </div>
  </body>
</html>
