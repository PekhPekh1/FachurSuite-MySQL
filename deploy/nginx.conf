# Nginx reverse proxy for the production deployment.
# Terminates TLS, forwards to the PM2-managed Next.js process on 127.0.0.1:3000,
# serves nothing from the upload directory statically (uploads are authorised
# streams), and adds upload limits plus security headers at the edge.
upstream app_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 8m; # receipts/documents are capped at 5 MB upstream
    client_body_timeout 30s;
    client_header_timeout 30s;

    location / {
        proxy_pass http://app_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Never serve the uploads directory directly.
    location /uploads/ { return 404; }
}
